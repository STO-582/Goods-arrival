name: Build Arrival JSON

                  return d.strftime('%Y-%m-%d')

              except:
                  return ''

          rows = []

          for _, row in df.iterrows():

              item_no = clean_item(
                  row.get('itemno', row.get('artno', ''))
              )

              if not item_no:
                  continue

              if item_no.replace('0', '') == '':
                  continue

              payload = {
                  'itemNo': item_no,
                  'itemName': clean_text(
                      row.get('itemname', row.get('artname', ''))
                  ),
                  'hfb': clean_text(row.get('hfb', '')),
                  'pa': clean_text(row.get('pa', '')),
                  'qty': clean_number(
                      row.get(
                          'qty',
                          row.get(
                              'latestqty',
                              row.get('quantity', 0)
                          )
                      )
                  ),
                  'status': clean_text(row.get('status', '')),
                  'container': clean_text(
                      row.get('container', '')
                  ),
                  'ssdRaw': clean_date(row.get('ssd')),
                  'edsRaw': clean_date(row.get('eds')),
                  'confirmedDate': clean_date(
                      row.get('confirmeddate')
                  ),
                  'expectedDate': clean_date(
                      row.get('expecteddate')
                  )
              }

              rows.append(payload)

          stat = os.stat(FILE_NAME)

          result = {
              'version': '5.0.0',
              'generatedAt': datetime.utcnow().isoformat(),
              'count': len(rows),
              'finalDateMs': int(stat.st_mtime * 1000),
              'updateDateStr': datetime.fromtimestamp(
                  stat.st_mtime
              ).strftime('%Y-%m-%d %H:%M:%S'),
              'data': rows
          }

          with open(OUTPUT_NAME, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False)

          print(f'Successfully exported {len(rows)} rows')

          PYTHON_EOF

          python build_json.py

