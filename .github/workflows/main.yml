name: Deploy STO582 Static Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify required files
        run: |
          test -f "index.html" || (echo "index.html not found" && exit 1)
          test -f "SSS ONLY_Goods Arrival.csv" || (echo "SSS ONLY_Goods Arrival.csv not found" && exit 1)

      - name: Prepare artifact
        run: |
          mkdir -p ./_site
          cp index.html ./_site/
          cp "SSS ONLY_Goods Arrival.csv" ./_site/
          [ -f Search.jpg ] && cp Search.jpg ./_site/ || true
          [ -f Arrival.jpg ] && cp Arrival.jpg ./_site/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
